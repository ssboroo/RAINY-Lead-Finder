name: Live registration check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check-live-registration.mjs
        env:
          LIVE_BASE_URL: https://rainy-lead-finder-production.up.railway.app
